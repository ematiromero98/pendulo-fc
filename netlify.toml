# Configuración de Netlify — sitio estático, sin build.
[build]
  publish = "."
  command = ""

# La raíz sirve la app directamente (sin redirección visible).
[[redirects]]
  from = "/"
  to = "/pendulo-fc.html"
  status = 200

# Cabeceras de seguridad (defensa en profundidad).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
